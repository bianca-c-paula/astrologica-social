name: instagram

# A cada 30 minutos entre 11h e 23h30 de Brasília (14h–02h30 UTC).
# O Mac também dispara (launchd), porque o cron do GitHub atrasa ou pula.
on:
  schedule:
    - cron: "*/30 14-23 * * *"
    - cron: "*/30 0-2 * * *"
  workflow_dispatch:

concurrency:
  group: instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/publicar_fila.py
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      # Guarda o registro do que saiu (mesmo se a publicação falhar no meio).
      - if: always()
        run: |
          git diff --quiet publicados.json && exit 0
          git config user.name "agenda-instagram"
          git config user.email "agenda-instagram@users.noreply.github.com"
          git add publicados.json
          git commit -m "publicado: $(date -u +%FT%H:%MZ)"
          git pull --rebase -q && git push -q
